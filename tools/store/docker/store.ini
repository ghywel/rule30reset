; PHP settings for the store. The store reads the raw request body itself (php://input), so PHP parses no POST body
; and tracks no upload progress (the mitigation of htaccess.example, kept here for every request).
enable_post_data_reading = Off
session.upload_progress.enabled = Off
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 64M
max_execution_time = 300
